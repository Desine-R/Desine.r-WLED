[platformio]
default_envs = desine_cntrl

; ------------------------------------------------------------------------------
; QuinLED Dig-Uno v3.1 r2 on a QuinLED-ESP32 base module + QuinLED-ESP32-Ethernet
; add-on. Superseded the GLEDOPTO Elite 4D-EXMU build: that board's 4 "spare"
; GPIOs all turned out to be one-way, 5V-buffered LED outputs (74HCT125), not
; general-purpose bidirectional GPIO, so I2C was never going to work on it.
; Pin plan (per QuinLED's own published pinout docs):
;   GPIO16      = LED1, single SK6812 RGBW strip
;   GPIO32 (Q4) = I2C SDA   -- moved off GPIO12 (see usermod header comment):
;                 GPIO12 is a flash-voltage strapping pin (MTDI/VDD_SDIO),
;                 sampled on every reset -- the ADS1115's onboard I2C pull-up
;                 holds it HIGH, which makes the ROM bootloader select the
;                 wrong flash voltage and fail to boot at all. Reproduced
;                 100% of the time. GPIO32 has no strapping function.
;   GPIO15 (Q1) = I2C SCL   -- documented "External GPIO", not ethernet-reserved
;   GPIO0       = next-effect button (native "Button" pin, pulled high, matches
;                 our existing active-LOW button code)
;   GPIO2  (Q3) = prev-effect button -- documented "External GPIO"
;   GPIO12 (Q2) = spare (do NOT use for anything with a pull resistor -- see above)
;   GPIO13      = onboard DS18B20 temp sensor -- left alone, not used by us
;   GPIO36 (A0) = onboard analog mic input -- not wired yet, audioreactive
;                 config pending (its default pins are disabled below so it
;                 doesn't fight our I2C/button pins in the meantime)
;   No relay on this board -- RLYPIN=-1.
;   Ethernet pins (GPIO5/17/18/19/21/22/23/25/26/27) are reserved by the
;   WLED_ETH_QUINLED (index 4, "QuinLed-ESP32-Ethernet") board profile in
;   wled00/network.cpp, which already matches this exact hardware -- no
;   custom ethernet pin flags needed, just WLED_ETH_DEFAULT to preselect it.
; ------------------------------------------------------------------------------
[env:custom_esp32_diguno_ads1115]
extends = env:esp32dev
board = esp32dev
upload_speed = 921600
custom_usermods = ${env:esp32_eth.custom_usermods} ADS1115_dual_control
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_DIGUNO_ADS1115\"
  -D RLYPIN=-1 -D WLED_USE_ETHERNET -D WLED_ETH_DEFAULT=4 -D BTNPIN=-1
  -D AUDIOPIN=-1 -D SR_DMTYPE=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1 ;; mic not wired yet, don't let audioreactive claim its default pins (15/32/14)
  -D DATA_PINS=16
  -D LED_TYPES=30 ;; TYPE_SK6812_RGBW
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_DEBUG ;; TEMPORARY: diagnose "pins already in use" on the new board
board_build.flash_mode = dio

; ------------------------------------------------------------------------------
; Desine.Cntrl -- the current client build (default env).
; Same Dig-Uno hardware, different client request: 5 Adafruit I2C QT Rotary
; Encoders (Seesaw-based) instead of ADS1115 pots. Same I2C bus (GPIO32 SDA /
; GPIO15 SCL), no separate physical next/prev buttons -- each encoder's own
; integrated pushbutton is used instead (rotate, short press, and long press
; each configurable per encoder). Kept as its own env rather than replacing
; custom_esp32_diguno_ads1115 so the pot-based build stays available.
; ------------------------------------------------------------------------------
; Client-facing names: SERVERNAME = device name in the WLED app/UI,
; WLED_AP_SSID = setup hotspot. WLED_RELEASE_NAME also names the .bin, and
; Wi-Fi (OTA) updates are rejected unless it matches the running firmware --
; keep it "Desine.Cntrl" from here on.
[env:desine_cntrl]
extends = env:esp32dev
board = esp32dev
upload_speed = 921600
custom_usermods = ${env:esp32_eth.custom_usermods} Desine.Cntrl
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_RELEASE_NAME=\"Desine.Cntrl\"
  -D SERVERNAME=\"Desine.Cntrl\"
  -D WLED_AP_SSID=\"Desine.Cntrl-AP\"
  -D RLYPIN=-1 -D WLED_USE_ETHERNET -D WLED_ETH_DEFAULT=4 -D BTNPIN=-1
  -D AUDIOPIN=-1 -D SR_DMTYPE=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1 ;; mic not wired yet, don't let audioreactive claim its default pins (15/32/14)
  -D DATA_PINS=16
  -D LED_TYPES=30 ;; TYPE_SK6812_RGBW
  -DARDUINO_USB_CDC_ON_BOOT=0
board_build.flash_mode = dio
